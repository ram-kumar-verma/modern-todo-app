<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Main Task Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#c0c1ff",
                        "secondary": "#c8c6c5",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-container": "#452000",
                        "surface-container-highest": "#34343d",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-primary-fixed": "#07006c",
                        "surface-container-high": "#292932",
                        "surface-container": "#1f1f27",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "inverse-on-surface": "#303038",
                        "tertiary-fixed-dim": "#ffb783",
                        "surface-tint": "#c0c1ff",
                        "surface-container-lowest": "#0d0d15",
                        "on-tertiary-fixed": "#301400",
                        "surface-bright": "#393841",
                        "surface-dim": "#13131b",
                        "outline": "#908fa0",
                        "secondary-fixed": "#e5e2e1",
                        "on-error": "#690005",
                        "surface-container-low": "#1b1b23",
                        "inverse-surface": "#e4e1ed",
                        "on-surface": "#e4e1ed",
                        "error": "#ffb4ab",
                        "primary-container": "#8083ff",
                        "primary-fixed-dim": "#c0c1ff",
                        "background": "#13131b",
                        "surface-variant": "#34343d",
                        "on-secondary-fixed-variant": "#474646",
                        "on-tertiary-fixed-variant": "#703700",
                        "tertiary-fixed": "#ffdcc5",
                        "on-secondary-container": "#bab8b7",
                        "on-primary": "#1000a9",
                        "tertiary": "#ffb783",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-tertiary": "#4f2500",
                        "on-primary-container": "#0d0096",
                        "secondary-container": "#4a4949",
                        "inverse-primary": "#494bd6",
                        "tertiary-container": "#d97721",
                        "on-background": "#e4e1ed",
                        "outline-variant": "#464554",
                        "error-container": "#93000a",
                        "surface": "#13131b",
                        "on-secondary": "#313030",
                        "on-surface-variant": "#c7c4d7",
                        "primary-fixed": "#e1e0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "unit": "4px",
                        "stack-gap": "12px",
                        "container-padding": "16px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-md-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md-mobile": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-sm min-h-screen relative overflow-x-hidden selection:bg-primary/30">
<!-- Ambient Background Light Orbs -->
<div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-primary/20 rounded-full blur-[100px] opacity-60 pointer-events-none z-0"></div>
<div class="fixed bottom-[10%] right-[-10%] w-[60vw] h-[60vw] bg-inverse-primary/15 rounded-full blur-[120px] opacity-50 pointer-events-none z-0"></div>
<!-- TopAppBar -->
<header class="bg-surface/10 backdrop-blur-[20px] border-b border-white/10 shadow-[0_20px_20px_rgba(192,193,255,0.15)] sticky full-width top-0 z-40">
<div class="flex justify-between items-center w-full px-margin-mobile py-4">
<div class="flex items-center gap-3">
<img alt="Profile" class="w-8 h-8 rounded-full border border-white/20 object-cover" data-alt="A highly detailed close-up portrait of a young professional in a softly lit, modern environment. The lighting is diffused, highlighting natural skin textures with a subtle cool undertone, fitting a premium dark-mode aesthetic. The background is a smooth, abstract blur of deep charcoal and indigo hues." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBZtpiptDRAUe5wS22UuhOkx1M3bjPCkFfrTreRlOfOMc5_ZK4xp_8xGB3eaQ1Watq5JIfZTBTfDjLOQeds9_CEbuZ5pRyhu_3xvl777qWEn33kIrfEgYbjoDvzeBqaPL0arHvNTwHU3RdXm1YGMEtB2M3IBGRGstfu3szLQGG6YsN_23klcQPiXFVnb2bdttwGx62L89oh_CHvahXRW9paMEPbJiSlptaoBxYZOqof-j4PJXs2UZ3J6qvLWzRPJ9OwMQ1y-_-Miko"/>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight font-bold">Focus</h1>
<button aria-label="Notifications" class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="relative z-10 px-margin-mobile pt-6 pb-[120px] max-w-2xl mx-auto flex flex-col gap-8">
<!-- Header Greeting -->
<section class="flex flex-col gap-1">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">Hello, Alex</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant/80">You have 4 tasks to illuminate today.</p>
</section>
<!-- Progress Card (Bento/Glass style) -->
<section class="relative bg-surface/15 backdrop-blur-[20px] border border-white/10 rounded-xl p-6 shadow-[0_8px_32px_rgba(192,193,255,0.05)] overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent pointer-events-none"></div>
<div class="relative z-10 flex flex-col gap-4">
<div class="flex justify-between items-end">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-1">Daily Progress</span>
<span class="font-display-lg-mobile text-display-lg-mobile text-primary">75%</span>
</div>
<span class="material-symbols-outlined text-primary/80 text-[32px] mb-1" data-icon="trending_up">trending_up</span>
</div>
<!-- Progress Bar -->
<div class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden mt-2 border border-white/5">
<div class="h-full bg-gradient-to-r from-primary to-inverse-primary rounded-full w-[75%] shadow-[0_0_10px_rgba(192,193,255,0.5)]"></div>
</div>
</div>
</section>
<!-- Task List -->
<section class="flex flex-col gap-stack-gap">
<!-- Task Item: High Priority -->
<div class="relative group flex items-center gap-4 bg-surface/10 backdrop-blur-[20px] border border-white/10 rounded-xl p-4 shadow-[0_4px_20px_rgba(0,0,0,0.2)] hover:bg-surface/20 transition-all duration-300 pl-5">
<!-- Priority Bar -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-[60%] bg-error rounded-r-full shadow-[0_0_8px_rgba(255,180,171,0.5)]"></div>
<!-- Custom Checkbox -->
<button class="w-6 h-6 rounded-full border-2 border-outline/40 bg-surface/20 backdrop-blur-md flex-shrink-0 flex items-center justify-center transition-all duration-200 active:scale-90 hover:border-primary/60">
</button>
<!-- Content -->
<div class="flex-1 flex flex-col gap-1">
<span class="font-body-lg text-body-lg text-on-surface font-medium">Finalize Q3 Presentation</span>
<div class="flex items-center gap-2">
<div class="flex items-center gap-1 bg-white/5 backdrop-blur-[10px] px-2 py-0.5 rounded-full border border-white/5">
<span class="material-symbols-outlined text-[14px] text-error" data-icon="work" data-weight="fill" style="font-variation-settings: 'FILL' 1;">work</span>
<span class="font-label-caps text-[10px] text-on-surface-variant">Work</span>
</div>
<span class="font-label-caps text-[10px] text-error">High</span>
</div>
</div>
</div>
<!-- Task Item: Medium Priority -->
<div class="relative group flex items-center gap-4 bg-surface/10 backdrop-blur-[20px] border border-white/10 rounded-xl p-4 shadow-[0_4px_20px_rgba(0,0,0,0.2)] hover:bg-surface/20 transition-all duration-300 pl-5">
<!-- Priority Bar -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-[60%] bg-tertiary rounded-r-full shadow-[0_0_8px_rgba(255,183,131,0.5)]"></div>
<!-- Custom Checkbox -->
<button class="w-6 h-6 rounded-full border-2 border-outline/40 bg-surface/20 backdrop-blur-md flex-shrink-0 flex items-center justify-center transition-all duration-200 active:scale-90 hover:border-primary/60">
</button>
<!-- Content -->
<div class="flex-1 flex flex-col gap-1">
<span class="font-body-lg text-body-lg text-on-surface font-medium">Schedule Dental Checkup</span>
<div class="flex items-center gap-2">
<div class="flex items-center gap-1 bg-white/5 backdrop-blur-[10px] px-2 py-0.5 rounded-full border border-white/5">
<span class="material-symbols-outlined text-[14px] text-tertiary" data-icon="health_and_safety" data-weight="fill" style="font-variation-settings: 'FILL' 1;">health_and_safety</span>
<span class="font-label-caps text-[10px] text-on-surface-variant">Health</span>
</div>
<span class="font-label-caps text-[10px] text-tertiary">Medium</span>
</div>
</div>
</div>
<!-- Task Item: Low Priority (Completed state example) -->
<div class="relative group flex items-center gap-4 bg-surface/5 backdrop-blur-[20px] border border-white/5 rounded-xl p-4 shadow-[0_4px_20px_rgba(0,0,0,0.1)] opacity-70 pl-5">
<!-- Priority Bar -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-[60%] bg-primary rounded-r-full"></div>
<!-- Custom Checkbox (Checked) -->
<button class="w-6 h-6 rounded-full bg-primary border-none flex-shrink-0 flex items-center justify-center shadow-[0_0_12px_rgba(192,193,255,0.4)]">
<span class="material-symbols-outlined text-on-primary text-[16px] font-bold" data-icon="check">check</span>
</button>
<!-- Content -->
<div class="flex-1 flex flex-col gap-1">
<span class="font-body-lg text-body-lg text-on-surface-variant line-through decoration-white/30">Read 20 pages of new book</span>
<div class="flex items-center gap-2">
<div class="flex items-center gap-1 bg-white/5 backdrop-blur-[10px] px-2 py-0.5 rounded-full border border-white/5">
<span class="material-symbols-outlined text-[14px] text-primary" data-icon="person" data-weight="fill" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-caps text-[10px] text-on-surface-variant">Personal</span>
</div>
<span class="font-label-caps text-[10px] text-primary">Low</span>
</div>
</div>
</div>
</section>
</main>
<!-- Floating Action Button (FAB) -->
<button class="fixed bottom-[100px] right-6 w-14 h-14 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-[0_0_24px_rgba(192,193,255,0.6)] hover:shadow-[0_0_32px_rgba(192,193,255,0.8)] border border-white/20 z-50 active:scale-90 transition-all duration-300 group">
<span class="material-symbols-outlined text-[32px] group-hover:rotate-90 transition-transform duration-300" data-icon="add">add</span>
</button>
<!-- BottomNavBar -->
<nav class="bg-surface/15 backdrop-blur-3xl border-t border-white/10 shadow-[0_-10px_30px_rgba(192,193,255,0.1)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 md:hidden rounded-t-xl">
<!-- Active Tab: Tasks -->
<a class="flex flex-col items-center justify-center text-primary font-bold scale-110 group" href="#">
<span class="material-symbols-outlined mb-1" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-caps text-label-caps">Tasks</span>
</a>
<!-- Inactive Tab: Focus -->
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary/80 transition-all active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="timer">timer</span>
<span class="font-label-caps text-label-caps">Focus</span>
</a>
<!-- Inactive Tab: Insights -->
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary/80 transition-all active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="insights">insights</span>
<span class="font-label-caps text-label-caps">Insights</span>
</a>
<!-- Inactive Tab: Settings -->
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary/80 transition-all active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-label-caps text-label-caps">Settings</span>
</a>
</nav>
</body></html>
